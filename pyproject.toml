[project]
name = "plume-model"
version = "0.0.1"
description = "Entraining plume model for wildfire plume rise"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plume_model*", "config*"]
